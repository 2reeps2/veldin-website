<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Veldin Solutions</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="icon" type="image/png" href="static/images/logo1.png">
    <style>
        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #2a2a2a;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header .logo img {
            max-height: 50px;
        }

        nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        nav a {
            color: #cccccc;
            text-decoration: none;
            font-size: 1em;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a.active,
        nav a:hover {
            color: #f5f5f5;
            font-weight: bold;
        }

        /* Page Layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #1f1f1f;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        /* Grid Container */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* Six columns */
            grid-auto-rows: 150px; /* Default row height */
            gap: 10px;
            padding: 10px;
        }

        /* Grid Items */
        .grid-item {
            background-color: #000000; /* Placeholder color */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        /* Custom Sizes */
        .grid-item.large {
            grid-column: span 3; /* Spans 3 columns */
            grid-row: span 2; /* Spans 2 rows */
        }

        .grid-item.medium {
            grid-column: span 2; /* Spans 2 columns */
            grid-row: span 1; /* Spans 1 row */
        }

        .grid-item.small {
            grid-column: span 1; /* Spans 1 column */
            grid-row: span 1; /* Spans 1 row */
        }

        /* Modal Styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
        }
    </style>
</head>

    <!-- Modal for Image -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <img id="modalImage" src="" alt="Enlarged Image">
    </div>

    <script>
        function openModal(image) {
            const modal = document.getElementById("imageModal");
            const modalImage = document.getElementById("modalImage");
            modalImage.src = image.src;
            modal.classList.add("show");
        }

        function closeModal() {
            const modal = document.getElementById("imageModal");
            modal.classList.remove("show");
        }
    </script>
